<!DOCTYPE html>
<html>

<head>
  <title>Navigator Assistant Options</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    #status {
      margin: 10px 0;
      padding: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .controls {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    #message-input {
      flex-grow: 1;
      padding: 5px;
    }

    #log {
      margin-top: 15px;
      padding: 8px;
      background: #fafafa;
      border: 1px solid #ddd;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
    }

    .log-header {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.8em;
      color: #666;
    }
  </style>
</head>

<body>
  <button id="connect">Connect to Hardware</button>
  <h1>Verbosity level</h1>
  <select id="verbosity">
    <option value="0">Low</option>
    <option value="1">Medium</option>
    <option value="2">High</option>
    <option value="3">Didactic</option>
  </select>
  <h1>Language</h1>
  <select id="language">
    <option value="en">English</option>
    <option value="fr">French</option>
  </select>
  <h1>Communication Protocol</h1>
  <select id="protocol">
    <option value="webusb">WebUSB</option>
    <option value="webRTC">WebRTC</option>
  </select>

  <div id="status"></div>
  <button id="save">Save</button>

  <h3>Vibration Controller</h3>
  <div class="controls">
    <input type="text" id="message-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>

  <div class="log-header">Received Messages:</div>
  <div id="log"></div>

  <script src="../lib/utils.js"></script>
  <script src="../lib/webrtc-manager.js"></script>
  <script src="com.js"></script>
  <script src="options.js"></script>
</body>

</html>
